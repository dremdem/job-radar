[project]
name = "job-radar"
version = "0.1.0"
description = "Local-first assistant for reviewing job opportunities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
job-radar = "job_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -n auto"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.per-file-ignores]
# Real vacancy titles with full-width and typographic characters, on purpose.
"tests/test_language.py" = ["RUF001"]
# Real Russian-language Telegram posts.
"tests/test_telegram.py" = ["RUF001"]
# Real Himalayas titles with typographic dashes.
"tests/test_himalayas.py" = ["RUF001"]
# Russian wording in vacancy texts.
"job_radar/stack.py" = ["RUF001"]
"tests/test_stack.py" = ["RUF001"]
"job_radar/hh/notifications.py" = ["RUF001"]
"tests/test_hh_notifications.py" = ["RUF001"]
"tests/test_claude.py" = ["RUF001"]
"tests/test_suggestions.py" = ["RUF001"]
"tests/test_hh_digests.py" = ["RUF001"]
"tests/test_hh_capture.py" = ["RUF001"]
"tests/test_skills.py" = ["RUF001"]
"job_radar/skills.py" = ["RUF001"]
"job_radar/hh/digests.py" = ["RUF001"]
"job_radar/claude/prompt.py" = ["RUF001"]

[tool.bandit]
# B310 (urlopen with a non-literal URL): every fetch goes to a fixed https API of a job
# board or to the local Ollama URL from the user's own config, never to a URL from input.
skips = ["B310"]
