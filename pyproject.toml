[project]
name = "job-radar"
version = "0.1.0"
description = "Local-first assistant for reviewing job opportunities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
job-radar = "job_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff.lint.per-file-ignores]
# Real vacancy titles with full-width and typographic characters, on purpose.
"tests/test_language.py" = ["RUF001"]
# Real Russian-language Telegram posts.
"tests/test_telegram.py" = ["RUF001"]
# Real Himalayas titles with typographic dashes.
"tests/test_himalayas.py" = ["RUF001"]
# Russian wording in vacancy texts.
"job_radar/stack.py" = ["RUF001"]
"tests/test_stack.py" = ["RUF001"]
"job_radar/hh/notifications.py" = ["RUF001"]
"tests/test_hh_notifications.py" = ["RUF001"]
"tests/test_claude.py" = ["RUF001"]
