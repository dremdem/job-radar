{% extends "base.html" %}
{% block content %}
<h2>Review queue</h2>
{% if has_any %}
<p class="small">Company history:
  <button id="expand-all" type="button" onclick="toggleHistory(true)">Expand all</button>
  <button id="collapse-all" type="button" onclick="toggleHistory(false)">Collapse all</button>
</p>
<script>
  // The row you last clicked stays highlighted, so you find it after reading the vacancy
  // in another tab. Remembered in this browser only; see docs/queue.md#current-row.
  (function () {
    var KEY = "jr-current-row";
    function remembered() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function show(id) {
      document.querySelectorAll("tr.current").forEach(function (r) { r.classList.remove("current"); });
      var row = id && document.getElementById(id);
      if (row) row.classList.add("current");
      return row;
    }
    function pick(event) {
      var row = event.target.closest && event.target.closest('tr[id^="opportunity-"]');
      if (!row) return;
      try { localStorage.setItem(KEY, row.id); } catch (e) {}
      show(row.id);
    }
    document.addEventListener("click", pick);
    document.addEventListener("auxclick", pick);  // middle click opens the link in a new tab
    document.addEventListener("htmx:afterSwap", function () { show(remembered()); });
    document.addEventListener("DOMContentLoaded", function () { show(remembered()); });
    // A saved description changes the score, so after a reload the row may sit elsewhere in the
    // list: bring it into view. The browser's own scroll restoration would undo this (#76).
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.addEventListener("load", function () {
      var row = show(remembered());
      if (row) row.scrollIntoView({block: "center"});
    });
  })();
  // jr-keep-scroll: actions that re-render the whole queue (rejected, reasons, notes) must not
  // move the page; state buttons replace only their row (#70).
  (function () {
    var kept = null;
    document.addEventListener("htmx:beforeSwap", function (e) {
      if (e.detail.target && e.detail.target.id === "queue") kept = window.scrollY;
    });
    document.addEventListener("htmx:afterSettle", function () {
      if (kept !== null) { window.scrollTo(0, kept); kept = null; }
    });
  })();
  // Works on rows re-rendered by HTMX too: it looks the lists up on every click.
  function toggleHistory(open) {
    document.querySelectorAll("details.history").forEach((d) => { d.open = open; });
  }
</script>
{% include "_queue.html" %}
{% else %}
<p class="muted">No opportunities yet. Import some with <code>job-radar sync &lt;source&gt;</code>.</p>
{% endif %}
<p id="arrivals" class="small" hidden></p>
<dialog id="description-dialog" aria-label="Vacancy description">
  <button type="button" class="dialog-close" aria-label="Close">×</button>
  <div class="dialog-body"></div>
</dialog>
<script>
  // Read a description in a large window: the row's button copies its <template> in.
  (function () {
    var dialog = document.getElementById("description-dialog");
    var body = dialog.querySelector(".dialog-body");
    document.addEventListener("click", function (event) {
      var button = event.target.closest && event.target.closest("button[data-description]");
      if (button) {
        var source = document.getElementById(button.dataset.description);
        if (!source) return;
        body.replaceChildren(source.content.cloneNode(true));
        dialog.showModal();
        body.scrollTop = 0;
        return;
      }
      // A click on the dark backdrop (outside the window) closes it.
      if (event.target === dialog) dialog.close();
    });
    dialog.querySelector(".dialog-close").addEventListener("click", function () { dialog.close(); });
  })();
</script>
<script>
  // Live updates from the Capture tab (bookmarklet): redraw the rows it changed, and say
  // when new vacancies arrived. Same local app, so a BroadcastChannel reaches this tab.
  (function () {
    if (!("BroadcastChannel" in window)) return;
    var channel = new BroadcastChannel("job-radar");
    var arrived = 0;
    channel.onmessage = function (event) {
      var data = event.data || {};
      if (data.type !== "captured") return;
      var query = new URLSearchParams(location.search).toString();
      (data.opportunity_ids || []).forEach(function (id) {
        var row = document.getElementById("opportunity-" + id);
        if (row && window.htmx) {
          htmx.ajax("GET", "/opportunities/" + id + "/row?" + query, {target: "#opportunity-" + id, swap: "outerHTML"});
        } else {
          arrived += 1;
        }
      });
      var note = document.getElementById("arrivals");
      if (arrived && note) {
        note.hidden = false;
        note.textContent = arrived + (arrived === 1 ? " new vacancy" : " new vacancies") + " arrived · ";
        var link = document.createElement("a"); link.href = location.href; link.textContent = "reload";
        note.appendChild(link);
      }
    };
  })();
</script>
<script>
  // Claude deep analysis (docs/claude.md): pick rows, queue them, and redraw each row when
  // its analysis is done. The status span polls itself while anything is pending.
  (function () {
    var seen = null;
    function picks() { return Array.from(document.querySelectorAll(".claude-pick:checked")).map(function (c) { return c.value; }); }
    document.addEventListener("click", function (event) {
      var id = event.target.id;
      if (id === "claude-select") {
        document.querySelectorAll("#queue-body tr[data-score]").forEach(function (row) {
          var box = row.querySelector(".claude-pick");
          if (box && parseFloat(row.dataset.score) >= 6.5) box.checked = true;
        });
      } else if (id === "claude-clear") {
        document.querySelectorAll(".claude-pick").forEach(function (c) { c.checked = false; });
      } else if (id === "claude-analyze") {
        var ids = picks();
        if (!ids.length) return;
        if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
        htmx.ajax("POST", "/claude/analyze", {target: "#claude-status", swap: "outerHTML", values: {ids: ids}})
          .then(function () { ids.forEach(redraw); });
        document.querySelectorAll(".claude-pick").forEach(function (c) { c.checked = false; });
      }
    });
    function redraw(id) {
      var row = document.getElementById("opportunity-" + id);
      if (!row || !window.htmx) return;
      var query = new URLSearchParams(location.search).toString();
      htmx.ajax("GET", "/opportunities/" + id + "/row?" + query, {target: "#opportunity-" + id, swap: "outerHTML"});
    }
    function check() {
      var status = document.getElementById("claude-status");
      if (!status) return;
      var recent = (status.dataset.recent || "").split(",").filter(Boolean);
      if (seen === null) { seen = new Set(recent); return; }  // already finished before this page
      recent.forEach(function (id) {
        if (seen.has(id)) return;
        seen.add(id);
        redraw(id);
        var row = document.getElementById("opportunity-" + id);
        var title = row ? row.querySelector("td a, td").textContent.trim().slice(0, 80) : "vacancy " + id;
        if ("Notification" in window && Notification.permission === "granted") new Notification("Claude analysis done", {body: title});
      });
    }
    document.body.addEventListener("htmx:afterSettle", function (event) {
      if (event.target && event.target.id === "claude-status") check();
    });
    check();
  })();
</script>
{% endblock %}
