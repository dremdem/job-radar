<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Radar{% endblock %}</title>
  <script>
    // The inbox look is dark (#158).
    document.documentElement.dataset.bsTheme = "dark";
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; --muted: #888; --line: #8884; }
    /* Inbox look (#158): dark ground, one blue accent, Plex. */
    [data-bs-theme=dark] { --bs-body-bg: #101318; --bs-body-color: #E6E8EC; --bs-border-color: #252A33;
      --bs-tertiary-bg: #161B22; --bs-secondary-color: #8A92A0; --bs-link-color: #8AB4FF; --bs-link-hover-color: #B3CEFF;
      --bs-primary: #3D7BFF; --bs-primary-rgb: 61, 123, 255; --line: #252A33; --muted: #8A92A0; }
    body { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 15px; max-width: 1440px; margin: 0 auto; padding: 0 20px 16px; }
    .btn-primary { --bs-btn-bg: #3D7BFF; --bs-btn-border-color: #3D7BFF; --bs-btn-hover-bg: #2F67E0; --bs-btn-hover-border-color: #2F67E0; }
    .btn-outline-primary { --bs-btn-color: #8AB4FF; --bs-btn-border-color: #3D7BFF; --bs-btn-hover-bg: #3D7BFF; --bs-btn-hover-border-color: #3D7BFF; }
    kbd { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 0 4px; background: #232A35; color: #A9B0BC; border-radius: 3px; margin-left: 4px; }
    .inbox-top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .inbox-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .inbox-search { min-width: 260px; background: #0C0F13; }
    .inbox-body { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: calc(100vh - 190px); min-height: 520px; background: #101318; }
    .inbox-list { flex: 0 0 440px; max-width: 46%; overflow-y: auto; border-right: 1px solid var(--line); }
    .inbox-detail { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 24px 28px; }
    .list-head { display: flex; justify-content: space-between; padding: 10px 18px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid #1C2129; position: sticky; top: 0; background: #101318; z-index: 1; }
    .pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid #1C2129; }
    .desc-switch { display: flex; gap: 4px; padding: 8px 14px; border-bottom: 1px solid #1C2129; font-size: 13px; position: sticky; top: 37px; background: #101318; z-index: 1; }
    .desc-switch a { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: #A9B0BC; text-decoration: none; }
    .desc-switch a.active { background: #232A35; border-color: #3D7BFF; color: #fff; }
    .item { display: flex; gap: 12px; padding: 12px 18px; border-left: 3px solid transparent; border-bottom: 1px solid #1C2129; color: inherit; text-decoration: none; }
    .item:hover { background: #151A21; color: inherit; }
    .item.selected { border-left-color: #3D7BFF; background: #18202B; }
    .item-score { flex: 0 0 38px; font-family: "IBM Plex Mono", monospace; font-size: 16px; }
    .item-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .item-title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }  /* wrap, never cut (#160) */
    .item-meta { font-size: 13px; color: #A9B0BC; overflow-wrap: anywhere; }
    .item-line { font-size: 12px; }
    #queue-body:not(:has(.item, p))::after { content: "Nothing here."; display: block; padding: 16px 20px; color: #8A92A0; }
    .notices { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1080; width: min(720px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; }
    .notice { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 16px; border-radius: 8px;
      background: #2A2216; border: 1px solid #8A6A2A; color: #F3E3C0; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); font-size: 14px; }
    .notice a { color: #FFD98A; }
    .score-hi { color: #7FD3A2; } .score-mid { color: #E6C46A; } .score-lo { color: #F29A8A; }
    .line-apply { color: #7FD3A2; } .line-maybe { color: #E6C46A; } .line-skip, .line-ignore { color: #F29A8A; } .line-muted { color: var(--muted); }
    .detail { display: flex; flex-direction: column; gap: 16px; }
    .detail-head { display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: space-between; }
    .detail-headline { min-width: 0; flex: 1 1 320px; }
    .detail-title { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
    .detail-meta { font-size: 14px; color: #A9B0BC; }
    .detail-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .detail-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .detail-links .link-btn { padding: 8px 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
    .detail-badges .badge { margin-left: 0; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .stat, .panel-card { padding: 14px 16px; border-radius: 8px; background: #161B22; border: 1px solid var(--line); }
    .stat-label, .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .stat-value { font-family: "IBM Plex Mono", monospace; font-size: 20px; }
    .stat-value.stat-text { font-family: inherit; font-size: 15px; font-weight: 600; }
    .panel-card h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .desc-text { white-space: pre-wrap; font-size: 14px; line-height: 1.6; max-height: 60vh; overflow-y: auto; }
    .desc-text mark { background: rgba(255, 200, 0, .3); color: inherit; padding: 0 2px; border-radius: 3px; }
    @media (max-width: 991px) {
      .inbox-body { display: block; height: auto; border: none; background: none; }
      .inbox-list { max-width: none; border: 1px solid var(--line); border-radius: 10px; }
      .inbox-detail { display: none; }
      .kbd-hint, kbd { display: none; }
      .stat-grid { grid-template-columns: minmax(0, 1fr); }
      .item { padding: 14px 14px; }
    }
    /* Bootstrap's .badge is filled white-on-colour; ours are outlined, keep them. */
    .badge { color: inherit; background: transparent; font-weight: 500; vertical-align: baseline; white-space: normal; text-align: left; overflow-wrap: anywhere; }
    .navbar .nav-link { padding: 4px 10px; }
    .nav-pills .nav-link { padding: 3px 12px; }
    .table { margin-bottom: 0; }
    a { text-decoration-thickness: 1px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .state { font-family: ui-monospace, monospace; }
    .actions button { margin-right: 4px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .badge { display: inline-block; padding: 0 6px; margin-left: 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; }
    .badge.warn { border-color: #c9a227; color: #c9a227; }
    .badge.reject { border-color: #d0583c; color: #d0583c; }
    .reasons { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
    .reasons .pos { color: #2e9d57; }
    .reasons .neg { color: #d0583c; }
    td a { color: inherit; }
    .history summary { cursor: pointer; margin-top: 4px; }
    .history ul { margin: 4px 0 0; padding-left: 16px; }
    .sync-log pre { font-size: 12px; white-space: pre-wrap; margin: 4px 0; }
    .claude .badge.verdict-apply { border-color: #3c9d5d; color: #3c9d5d; }
    .claude .badge.verdict-skip { border-color: #d0583c; color: #d0583c; }
    .claude .badge.verdict-maybe { border-color: #c9a227; color: #c9a227; }
    .claude-result ul { margin: 2px 0 6px 18px; padding: 0; }
    .claude .unverified { text-decoration: underline dotted; }
    .chat .msg { margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--line); }
    .chat .msg-assistant { border-left-color: #3c9d5d; }
    .chat .msg-text { white-space: pre-wrap; }
    .sync-steps { list-style: none; margin: 4px 0; padding: 0; }
    .sync-steps .step-icon { display: inline-block; min-width: 1.6em; }
    .sync-steps .step-failed, .neg { color: #d0583c; }
    .sync-steps .step-off { opacity: .55; }
    .suggest { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .btn-suggest { border: 1px solid #d0583c; color: #d0583c; background: transparent; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
    .btn-suggest:hover { background: rgba(208, 88, 60, 0.12); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 6px 0; }
    .chip { border: 1px solid var(--line); border-radius: 999px; background: transparent; color: inherit; padding: 2px 10px; cursor: pointer; font-size: 12px; }
    .chip:hover { border-color: #d0583c; color: #d0583c; }
    .chips .note-form { flex-basis: 100%; }
    /* Fold/unfold targets (#129): the whole line toggles, with Show / Hide on the right. */
    summary.fold { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: 8px; padding: 2px 4px; }
    summary.fold::-webkit-details-marker { display: none; }
    summary.fold::before { content: "▸"; display: inline-block; transition: transform .15s; color: var(--bs-secondary-color); }
    details[open] > summary.fold::before { transform: rotate(90deg); }
    summary.fold:hover { background: var(--bs-tertiary-bg); }
    summary.fold-claude { border: 1px solid var(--bs-border-color); padding: 6px 10px; margin: 4px 0; }
    summary.fold-claude::before { content: none; }
    .claude, .claude-result { display: block; width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    summary.fold-claude { width: 100%; box-sizing: border-box; }
    summary.fold-claude .fold-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    summary.fold-claude .fold-hint { flex: 0 0 auto; align-self: flex-start; padding-top: 2px; }
    summary.fold-claude .fold-hint::after { content: "Show ▾"; white-space: nowrap; font-size: 13px; color: var(--bs-link-color); }
    details[open] > summary.fold-claude .fold-hint::after { content: "Hide ▴"; }
    .sort-link { color: inherit; text-decoration: none; white-space: nowrap; }
    .sort-link:hover { text-decoration: underline; }
    .why > summary { cursor: pointer; margin-top: 4px; }
    .page-state button { margin-right: 4px; }
    /* Phone (#111): rows become cards, nothing scrolls sideways. */
    @media (max-width: 720px) {
      body { padding: 10px; font-size: 16px; }
      h1 { font-size: 24px; margin: 4px 0 8px; }
      .navbar { padding: 4px 0; gap: 4px !important; }
      .navbar-brand { font-size: 18px; margin-right: 4px; }
      .navbar .nav-link { padding: 2px 6px; font-size: 14px; }
      .navbar .btn { min-height: 30px; padding: 2px 10px; }
      .nav-pills .nav-link { padding: 2px 10px; font-size: 14px; }
      h2 { font-size: 19px; margin-bottom: 4px; }
      h2 { font-size: 20px; }
      nav { line-height: 2.2; }
      button { min-height: 36px; padding: 4px 10px; }
      table, thead, tbody, tr, td { display: block; width: 100%; box-sizing: border-box; }
      thead tr:first-child { display: none; }
      #applications tbody > tr {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px;
        border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 10px 0;
      }
      #applications tbody > tr > td { border: none; padding: 0; }
      #applications td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: 13px; }
      table.skills td { padding: 2px 0; border: none; }
      table.skills tr { border-bottom: 1px solid var(--bs-border-color); padding: 6px 0; }
      table.skills td[data-label] { display: inline-block; width: auto; margin-right: 12px; }
      table.skills td[data-label]::before { content: attr(data-label) ": "; color: var(--bs-secondary-color); }
      table.skills td.text-nowrap { white-space: normal !important; }
      summary.fold { min-height: 40px; padding: 6px 8px; }
      summary.fold-claude { min-height: 48px; background: var(--bs-tertiary-bg); }
      #applications tbody > tr { grid-template-columns: minmax(0, 1fr); }
      #applications .actions { display: flex; gap: 6px; }
      textarea { width: 100%; box-sizing: border-box; }
      .chips .chip { min-height: 30px; padding: 2px 12px; font-size: 13px; }
      .chips input[name=comment] { flex: 1 1 140px; min-width: 0; }
      .desc-text, .msg-text { overflow-wrap: anywhere; }
      td a, li { overflow-wrap: anywhere; }
    }
    /* Pages in the inbox look (#168). */
    .page-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin: 8px 0 20px; }
    .page-head h1 { font-size: 24px; font-weight: 600; margin: 0; }
    .page-sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; max-width: 860px; }
    .page-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: 20px; }
    .stat-grid.stat-grid-auto { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    @media (max-width: 720px) { .stat-grid.stat-grid-auto { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .section-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
    .section-title { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
    .panel-card > .section-title { margin-bottom: 8px; }
    .table-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: clip; background: #101318; }
    .data-table { --bs-table-bg: transparent; }
    .data-table th { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background: #161B22; padding: 10px 12px; position: sticky; top: 0; z-index: 1; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid #1C2129; }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: #151A21; }
    .mono { font-family: "IBM Plex Mono", monospace; font-size: 13px; white-space: nowrap; }
    .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-family: "IBM Plex Sans", sans-serif; color: #A9B0BC; }
    .pill-applied, .pill-learnable { color: #8AB4FF; border-color: #2B4C8C; }
    .pill-rejected, .pill-blocker { color: #F29A8A; border-color: #6B2E25; }
    .pill-interview, .pill-offer, .pill-known { color: #7FD3A2; border-color: #2F7D52; }
    .check-list { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 16px; }
    .check-list .form-check { margin: 0; }
    .form-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 12px 0; }
    .num-input { width: 6em; }
    .jr-dialog { width: min(520px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 10px; background: #161B22; color: inherit; padding: 20px 24px; }
    .jr-dialog::backdrop { background: rgba(0, 0, 0, .55); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 8px; }
    .form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    .profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .profile-grid .profile-known { grid-row: span 2; }
    .profile-grid .profile-rules { grid-column: 1 / -1; }
    .profile-grid label { display: block; margin: 0; }
    .profile-grid textarea { background: #0C0F13; font-size: 14px; line-height: 1.5; }
    .bookmarklet { display: inline-flex; align-items: center; padding: 10px 18px; min-height: 44px; border-radius: 8px; background: #3D7BFF; color: #fff; font-weight: 600; text-decoration: none; cursor: grab; }
    .bookmarklet:hover { background: #2F67E0; color: #fff; }
    .bookmarklet-debug { padding: 2px 10px; min-height: 0; background: transparent; border: 1px solid #3D7BFF; color: #8AB4FF; font-weight: 500; }
    #result:not(:empty), .notice-inline { padding: 12px 16px; border-radius: 8px; background: #16243A; border: 1px solid #2B4C8C; }
    #result p { margin: 0 0 4px; }
    @media (max-width: 720px) {
      .page-head h1 { font-size: 20px; }
      .table-wrap { border: none; background: none; overflow: visible; }
      .profile-grid { grid-template-columns: minmax(0, 1fr); }
      .profile-grid .profile-known { grid-row: auto; }
      .page-tools, .page-tools label, .page-tools select { width: 100%; }
    }
    #arrivals { margin: 6px 0; }

    .note-form summary { cursor: pointer; margin-bottom: 4px; }
    .note-form form { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    button.link { border: none; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
  </style>
</head>
<body>
  {% set path = request.url.path %}
  <nav class="navbar navbar-expand border-bottom mb-3 flex-wrap gap-2">
    <a class="navbar-brand fw-bold" href="/">Job Radar</a>
    <div class="navbar-nav flex-wrap">
      {% for href, label in [("/", "Queue"), ("/applications", "Applications"), ("/capture", "Capture"), ("/skills", "Skills"), ("/settings", "Settings"), ("/profile", "Profile")] %}
      <a href="{{ href }}" class="nav-link{% if path == href or (href == '/' and path.startswith('/opportunities')) %} active{% endif %}">{{ label }}</a>
      {% endfor %}
    </div>
    <button type="button" class="btn btn-sm btn-primary" hx-post="/sync" hx-target="#sync-status" hx-swap="outerHTML">Sync</button>
  </nav>
  <div><span id="sync-status" class="small" hx-get="/sync/status" hx-trigger="load" hx-swap="outerHTML"></span></div>
  {% block content %}{% endblock %}
<script>
  // Copy a Claude answer in one tap (#152); http on a LAN address has no Clipboard API.
  document.addEventListener("click", function (event) {
    var button = event.target.closest(".copy-answer");
    if (!button) return;
    var text = button.parentElement.querySelector(".msg-raw").value;
    function done() { var label = button.textContent; button.textContent = "Copied ✓"; setTimeout(function () { button.textContent = label; }, 1500); }
    function fallback() {
      var area = document.createElement("textarea");
      area.value = text; area.style.position = "fixed"; area.style.opacity = "0";
      document.body.appendChild(area); area.select();
      try { document.execCommand("copy"); done(); } finally { area.remove(); }
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  });
</script>
<script>
  // A finished sync can be dismissed until the next one; the browser remembers which (#147).
  (function () {
    var KEY = "jr-sync-dismissed";
    function apply(el) {
      if (!el || !el.dataset.finished) return;
      var dismissed = null;
      try { dismissed = localStorage.getItem(KEY); } catch (e) {}
      el.hidden = dismissed === el.dataset.finished;
    }
    document.addEventListener("click", function (event) {
      var button = event.target.closest(".sync-dismiss");
      if (!button) return;
      var el = document.getElementById("sync-status");
      try { localStorage.setItem(KEY, el.dataset.finished); } catch (e) {}
      el.hidden = true;
    });
    document.body.addEventListener("htmx:afterSettle", function () { apply(document.getElementById("sync-status")); });
  })();
</script>
<script>
  // On a phone, long parts of each row start folded (#111); desktop keeps them open.
  (function () {
    var phone = window.matchMedia("(max-width: 720px)");
    function fold(root) {
      if (!phone.matches) return;
      (root || document).querySelectorAll("details.why[open], details.history[open]").forEach(function (d) { d.open = false; });
    }
    fold(document);
    document.body.addEventListener("htmx:afterSwap", function (event) { fold(event.target); });
  })();
</script>
</body>
</html>
