<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Radar{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; --muted: #888; --line: #8884; }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .state { font-family: ui-monospace, monospace; }
    .actions button { margin-right: 4px; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <h1><a href="/" style="color: inherit; text-decoration: none">Job Radar</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
