<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Radar{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; --muted: #888; --line: #8884; }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .state { font-family: ui-monospace, monospace; }
    .actions button { margin-right: 4px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .badge { display: inline-block; padding: 0 6px; margin-left: 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; }
    .badge.warn { border-color: #c9a227; color: #c9a227; }
    .badge.reject { border-color: #d0583c; color: #d0583c; }
    .reasons { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
    .reasons .pos { color: #2e9d57; }
    .reasons .neg { color: #d0583c; }
    td a { color: inherit; }
    .history summary { cursor: pointer; margin-top: 4px; }
    .history ul { margin: 4px 0 0; padding-left: 16px; }
    .filter-row th { padding-top: 0; font-weight: 400; }
    .filter-row input[type=search] { width: 100%; box-sizing: border-box; min-width: 80px; }
    .sync-log pre { font-size: 12px; white-space: pre-wrap; margin: 4px 0; }
    tr.current > td { background: rgba(120, 140, 255, 0.14); }
    tr.current > td:first-child { box-shadow: inset 4px 0 0 #7b8cff; }
    #description-dialog { width: min(850px, 92vw); max-height: 85vh; padding: 0; border: 1px solid var(--line); border-radius: 10px; }
    #description-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    #description-dialog .dialog-body { max-height: 85vh; overflow-y: auto; padding: 20px 32px 28px; font-size: 17px; line-height: 1.6; box-sizing: border-box; }
    #description-dialog h3 { margin: 0 32px 4px 0; font-size: 21px; }
    #description-dialog .desc-text { white-space: pre-wrap; margin-top: 14px; }
    #description-dialog mark { background: rgba(255, 200, 0, 0.35); color: inherit; padding: 0 2px; border-radius: 3px; }
    .dialog-close { position: absolute; top: 10px; right: 14px; font-size: 22px; line-height: 1; border: none; background: none; color: inherit; cursor: pointer; }
    #arrivals { margin: 6px 0; }
    .tabs { margin: 8px 0 12px; }
    td.country { white-space: nowrap; font-weight: 500; }
    .tabs a.active { font-weight: 600; text-decoration: none; color: inherit; }
    .note-form summary { cursor: pointer; margin-bottom: 4px; }
    .note-form form { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    button.link { border: none; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
  </style>
</head>
<body>
  <h1><a href="/" style="color: inherit; text-decoration: none">Job Radar</a></h1>
  <nav class="small"><a href="/">Queue</a> · <a href="/applications">Applications</a> · <a href="/capture">Capture</a> · <a href="/settings">Settings</a>
    · <button type="button" hx-post="/sync" hx-target="#sync-status" hx-swap="outerHTML">Sync mail</button>
    <span id="sync-status" class="small" hx-get="/sync/status" hx-trigger="load" hx-swap="outerHTML"></span></nav>
  {% block content %}{% endblock %}
</body>
</html>
