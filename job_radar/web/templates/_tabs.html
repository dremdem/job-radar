<nav id="tabs" class="tabs nav nav-pills flex-wrap gap-1 my-2"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% for key, label, count, href in tabs %}<a href="{{ href }}" class="nav-link{% if key == tab %} active{% endif %}"{% if key == tab %} aria-current="page"{% endif %}>{{ label }} ({{ count }})</a>{% endfor %}
</nav>
